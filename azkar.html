<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نُور | الأذكار والتسابيح</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        .glow-effect { box-shadow: 0 0 30px -10px rgba(99, 102, 241, 0.2); }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white pb-20">

    <header class="w-full p-4 md:px-8 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto bg-slate-900/60 backdrop-blur-xl border border-slate-800/80 rounded-2xl px-6 py-4 flex items-center justify-between glow-effect">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-black text-xl shadow-lg text-white">ن</div>
                <span class="text-xl font-bold tracking-wider bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">نُور | Noor</span>
            </div>
            
            <nav class="flex items-center gap-2 bg-slate-950/50 p-1.5 rounded-xl border border-slate-800/50 text-sm">
                <a href="index.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition">القرّاء</a>
                <a href="azkar.html" class="px-4 py-2 rounded-lg bg-indigo-600/20 text-indigo-400 font-semibold border border-indigo-500/30">الأذكار</a>
                <a href="favorites.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800/50 transition">المفضلة</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-8 flex flex-col gap-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gradient-to-r from-indigo-950/40 via-slate-900/40 to-slate-900/60 p-8 rounded-3xl border border-indigo-500/20 backdrop-blur-md">
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-white">حصن المسلم والأذكار</h1>
                <p class="text-slate-400 text-sm mt-1">أذكار الصباح والمساء والتسبيح مع عداد تفاعلي</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-950/60 p-1.5 rounded-2xl border border-slate-800">
                <button onclick="filterAzkar('sabah')" id="btn-sabah" class="px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white transition">أذكار الصباح</button>
                <button onclick="filterAzkar('misaa')" id="btn-misaa" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition">أذكار المساء</button>
                <button onclick="filterAzkar('tasbeeh')" id="btn-tasbeeh" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition">تسابيح</button>
            </div>
        </div>

        <div id="azkar-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>

    <script>
        const azkarData = [
            { category: "sabah", text: "آية الكرسي: ﴿اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...﴾ [البقرة: 255]", count: 1 },
            { category: "sabah", text: "قراءة المعوذات: سورة الإخلاص، وسورة الفلق، وسورة الناس.", count: 3 },
            { category: "sabah", text: "أصبحنا وأصبح الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.", count: 1 },
            { category: "sabah", text: "اللهم بك أصبحنا، وبك أمسينا، وبك نحيا، وبك نموت وإليك النشور.", count: 1 },
            { category: "sabah", text: "سيد الاستغفار: اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي، وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت.", count: 1 },
            { category: "misaa", text: "آية الكرسي: ﴿اللَّهُ لَا إِلَهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...﴾ [البقرة: 255]", count: 1 },
            { category: "misaa", text: "قراءة المعوذات: سورة الإخلاص، وسورة الفلق، وسورة الناس.", count: 3 },
            { category: "misaa", text: "أمسينا وأمسى الملك لله، والحمد لله، لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير.", count: 1 },
            { category: "tasbeeh", text: "سبحان الله وبحمده، سبحان الله العظيم", count: 100 },
            { category: "tasbeeh", text: "أستغفر الله وأتوب إليه", count: 100 }
        ];

        let currentCategory = 'sabah';

        function filterAzkar(cat) {
            currentCategory = cat;
            document.querySelectorAll('[id^="btn-"]').forEach(btn => {
                btn.className = "px-4 py-2 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition";
            });
            document.getElementById(`btn-${cat}`).className = "px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white transition";
            renderAzkar();
        }

        function renderAzkar() {
            const container = document.getElementById('azkar-container');
            container.innerHTML = '';
            const filtered = azkarData.filter(item => item.category === currentCategory);

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/40 border border-slate-800/80 p-6 rounded-2xl flex flex-col justify-between gap-4 backdrop-blur-md";
                card.innerHTML = `
                    <p class="text-base leading-relaxed text-slate-200 font-medium">${item.text}</p>
                    <div class="flex items-center justify-between border-t border-slate-800/60 pt-4 mt-2">
                        <span class="text-xs text-slate-500">التكرار المطلوب: ${item.count}</span>
                        <button onclick="decreaseCount(this)" class="bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 px-5 py-2 rounded-xl font-bold text-sm hover:bg-indigo-600 hover:text-white transition active:scale-95">
                            العداد: <span class="counter-num">${item.count}</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function decreaseCount(btn) {
            const counterSpan = btn.querySelector('.counter-num');
            let current = parseInt(counterSpan.textContent);
            if (current > 1) {
                counterSpan.textContent = current - 1;
            } else {
                counterSpan.textContent = "تم ✓";
                btn.className = "bg-emerald-600/20 border border-emerald-500/30 text-emerald-400 px-5 py-2 rounded-xl font-bold text-sm cursor-default";
            }
        }

        renderAzkar();
    </script>

    <!-- Vercel Web Analytics -->
    <script type="module">
        import { inject } from 'https://cdn.jsdelivr.net/npm/@vercel/analytics@1/dist/index.mjs';
        inject({ mode: 'production' });
    </script>
</body>
</html>
