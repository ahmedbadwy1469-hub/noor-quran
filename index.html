            const selectedCountry = sampleCountries[i % sampleCountries.length];
            allReciters.push({

                riwaya: "رواية حفص عن عاصم",
                country: selectedCountry,
                server: "https://server11.mp3quran.net/yasser/"
            });
        }

                groupsContainer.innerHTML = `
                    <div class="text-center py-16 bg-slate-900/30 border border-slate-800 rounded-3xl p-8">
                        <span class="text-5xl">🔍</span>
                        <h3 class="text-lg font-bold text-slate-300 mt-4">لا توجد نتائج تطابق بحثك</h3>
                        <p class="text-slate-500 text-sm mt-1">تأكد من كتابة الاسم بشكل صحيح أو جرب فلتر آخر</p>
                    </div>
                `;
                return;
            }

            // تقسيم القراء إلى مجموعات حسب جنسيتهم
            const grouped = {};
            recitersList.forEach(r => {
                if (!grouped[r.country]) {
                    grouped[r.country] = [];
                }
                grouped[r.country].push(r);
            });

            // رسم كل جروب مع عنوان الدولة
            for (const [countryName, recitersInCountry] of Object.entries(grouped)) {
                const groupSection = document.createElement('div');
                groupSection.className = "flex flex-col gap-4";

                groupSection.innerHTML = `
                    <div class="flex items-center gap-3 border-b border-slate-800 pb-3">
                        <div class="w-3 h-8 bg-indigo-600 rounded-full"></div>
                        <h2 class="text-xl font-bold text-white">قرّاء دولة ${countryName}</h2>
                        <span class="text-xs px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700/60 text-indigo-400 font-bold">${recitersInCountry.length} قارئ</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        ${recitersInCountry.map(reciter => `
                            <a href="reciter.html?name=${encodeURIComponent(reciter.name)}&server=${encodeURIComponent(reciter.server)}" class="bg-slate-900/40 border border-slate-800/80 p-5 rounded-2xl flex items-center gap-4 hover:border-indigo-500/40 hover:bg-slate-800/40 transition group cursor-pointer">
                                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600/20 to-violet-600/20 border border-indigo-500/30 flex items-center justify-center text-xl shrink-0 group-hover:scale-105 transition">🎧</div>
                                <div class="overflow-hidden">
                                    <h3 class="font-bold text-white group-hover:text-indigo-400 transition truncate">${reciter.name}</h3>
                                    <p class="text-xs text-slate-400 mt-1 truncate">${reciter.riwaya}</p>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                `;

                groupsContainer.appendChild(groupSection);
            }
        }

        // تشغيل العرض للكل أول مرة
        renderGroups(allReciters);

        // الفلترة بالضغط على زر الدولة
        let activeCountry = 'الكل';
        function filterByCountry(country) {
            activeCountry = country;

            // تحديث ستايل الأزرار
            document.querySelectorAll('.country-btn').forEach(btn => {
                if (btn.textContent.includes(country)) {
                    btn.className = "country-btn px-4 py-2 rounded-xl text-xs font-bold bg-indigo-600 text-white shrink-0 transition shadow-lg";
                } else {
                    btn.className = "country-btn px-4 py-2 rounded-xl text-xs font-bold bg-slate-900/80 text-slate-400 border border-slate-800 hover:text-white shrink-0 transition";
                }
            });

            applyFilters();
        }

        // البحث اللحظي
        document.getElementById('search-input').addEventListener('input', applyFilters);

        function applyFilters() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();

            const filtered = allReciters.filter(r => {
                const matchesCountry = (activeCountry === 'الكل') || (r.country === activeCountry);
                const matchesSearch = r.name.toLowerCase().includes(query) || 
                                      r.riwaya.toLowerCase().includes(query) ||
                                      r.country.toLowerCase().includes(query);
                return matchesCountry && matchesSearch;
            });

            renderGroups(filtered);
        }
    </script>
</body>
</html>
